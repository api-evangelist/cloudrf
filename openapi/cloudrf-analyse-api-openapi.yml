  /network:
    get:
      operationId: network
      tags:
      - Analyse
      summary: Find the best server for a receiver
      description: This endpoint allows users to query the network to find the best server(s) for a given receiver/customer location. A previously generated network is required. This method returns more data than the points API as it includes the arrays for terrain, landcover, obstructions, and path loss for each server.
      parameters:
      - in: query
        required: true
        description: Network name.
        name: net
        schema:
          type: string
      - in: query
        required: true
        description: Super layer name.
        name: nam
        schema:
          type: string
      - in: query
        required: true
        description: Latitude in decimal degrees.
        name: lat
        schema:
          type: number
          format: float
      - in: query
        required: true
        description: Longitude in decimal degrees.
        name: lon
        schema:
          type: number
          format: float
      - in: query
        required: true
        description: Height above ground level in meters.
        name: alt
        schema:
          type: number
          format: float
      - in: query
        required: false
        description: Receiver gain in dBi.
        name: rxg
        schema:
          type: number
          format: float
      responses:
        '200':
          description: Success - JSON object returned providing results with a detailed path-profile output for each server.
          content: {}
  /trilateration:
    post:
      operationId: trilateration
      tags:
      - Analyse
      summary: Geo-locate a signal using received power measurements
      description: This endpoint allows users to query sites to find areas of mutual interest where a signal might be. It uses receiver power measurements (including nil returns) and modelling to produce a much more accurate output than legacy trilateration using circles. The accuracy is determined by both the modelling and the errordB value which lets users specify trilateration error. About 10dB is recommended.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                colourKey:
                  description: Colour key name. Recommended value is 9 (Greyscale)
                  type: string
                  example: 9
                errordB:
                  description: Trilateration error in decibels. This should be set with care as too low will produce no matches and too high will show signals everywhere. Recommend 10dB.
                  type: number
                  format: float
                  example: 10
                connected:
                  description: Array of sites and rssi values from where a signal has been detected
                  type: array
                  items:
                    type: object
                    properties:
                      site:
                        description: Unique filename for the site
                        type: string
                        example: 0320153726_Trilateration-demo_A
                      rssi:
                        description: Received signal strength from the site in dBm
                        type: number
                        format: float
                        example: -90
                disconnected:
                  description: Array of sites from where a signal has NOT been detected
                  type: array
                  items:
                    type: object
                    properties:
                      site:
                        description: Unique filename for the site
                        type: string
                        example: 0320153755_Trilateration-demo_B
      responses:
        '200':
          description: Success - JSON object returned providing results with a PNG URL, Web mercator bounds and area metadata.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the results of the /trilateration call designed for a web mercator map
                properties:
                  areaKm2:
                    type: number
                    format: float
                    description: Search area measured in square kilometers
                    example: 0.1
                  areaPx:
                    type: number
                    format: float
                    description: Number of covered pixels
                    example: 77
                  pngUrl:
                    type: string
                    format: uri
                    description: URL to EPSG 3857 image file applying the Mercartor projection standard.
                    example: https://api.cloudrf.com/users/1/GEO/1710949057.png
                  pngBounds:
                    type: array
                    description: A list of image bounds as WGS84 decimal degrees. Order is clockwise from North,East,South,West.
                    items:
                      type: integer
                      format: float
                      example:
                      - 38.942844475233805
                      - 1.4826338797780443
                      - 38.88915552476619
                      - 1.413357814658543
components:
  schemas:
    Transmitter:
      type: object
      properties:
        lat:
          description: Latitude of transmitter in WGS84 decimal degrees.
          type: number
          format: float
          minimum: -89
          maximum: 89
          default: 38.916
          example: 38.916
        lon:
          description: Longitude of transmitter in WGS84 decimal degrees.
          type: number
          format: float
          minimum: -180
          maximum: 180
          default: 1.448
          example: 1.448
        alt:
          description: Altitude of transmitter above ground level in `metric` or `imperial`. Distance unit set in `output` object.
          type: number
          format: float
          minimum: 0.1
          maximum: 120000
          default: 1
          example: 1
        frq:
          description: Center frequency in megahertz.
          type: number
          format: float
          minimum: 2
          maximum: 100000
          default: 868
          example: 868
        txw:
          description: Transmitter power in watts before the antenna.
          type: number
          format: float
          minimum: 0.001
          maximum: 2000000
          default: 0.1
          example: 0.1
        bwi:
          description: "Bandwidth in MHz. \n* 1MHz has a noise floor of -114dBm\n* 10MHz has a noise floor of -104dBm\n* 20MHz has a noise floor of -101dBm\n"
          type: number
          format: float
          minimum: 0.001
          maximum: 200
          default: 0.1
          example: 1
    Antenna:
      type: object
      properties:
        txg:
          description: Transmitter antenna gain in dBi. A half-wave dipole has a gain of 2.15dBi. A mobile phone is 0 to 2dBi, depending on the frequency.
          type: number
          format: float
          minimum: -10
          maximum: 60
          default: 2.15
          example: 2.15
        txl:
          description: Feeder loss in dB. A long feeder has more loss. Loss varies by material and wavelength eg. LMR-400
          type: number
          format: float
          minimum: 0
          maximum: 60
          default: 0
          example: 1
        ant:
          description: 'Antenna pattern code:

            * `0` - Allows custom options (see: `hbw`; `vbw`; `fbr`)

            * `1` - Vertical dipole (omni-directional)

            '
          type: number
          format: integer
          default: 1
          example: 39
          enum:
