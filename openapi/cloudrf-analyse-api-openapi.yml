                        g: 149
                        b: 0
                      - l: 4dB
                        r: 254
                        g: 170
                        b: 0
                      - l: 3dB
                        r: 254
                        g: 191
                        b: 0
                      - l: 2dB
                        r: 254
                        g: 212
                        b: 0
                      - l: 1dB
                        r: 254
                        g: 234
                        b: 0
                      - l: 0dB
                        r: 254
                        g: 254
                        b: 0
                      - l: -1dB
                        r: 234
                        g: 254
                        b: 0
                      - l: -2dB
                        r: 213
                        g: 254
                        b: 0
                      - l: -3dB
                        r: 191
                        g: 254
                        b: 0
                      - l: -4dB
                        r: 170
                        g: 254
                        b: 0
                      - l: -5dB
                        r: 149
                        g: 254
                        b: 0
                      - l: -6dB
                        r: 128
                        g: 254
                        b: 0
                      - l: -7dB
                        r: 106
                        g: 254
                        b: 0
                      - l: -8dB
                        r: 85
                        g: 254
                        b: 0
                      - l: -9dB
                        r: 64
                        g: 254
                        b: 0
                      - l: -10dB
                        r: 43
                        g: 254
                        b: 0
                      - l: -11dB
                        r: 21
                        g: 254
                        b: 0
                      - l: -12dB
                        r: 0
                        g: 254
                        b: 0
                  elapsed:
                    description: Time taken for API call (milliseconds).
                    type: number
                    format: int32
                    example: 1572
                  balance:
                    description: API call credit usage. Only applies to public system.
                    type: integer
                    format: int32
                    example: 1
                  calculation_adjusted:
                    type: array
                    description: An array of messages indicating if a calculation was adjusted due to account limitations or restrictions on settings.
                    items:
                      type: string
                    example:
                    - Removing site '1125164804_testJ_A' from jammer list as it exists in signal list
                  resolution:
                    description: The resolution of the output image (meters).
                    type: number
                    example: 10
                  percentage_above_js:
                    type: array
                    description: Array of objects with the percentage of the signal that is above a certain JS ratio.
                    items:
                      type: object
                      properties:
                        js:
                          type: number
                          description: A Jamming-Signal ratio.
                          example: 3
                        percentage:
                          type: integer
                          description: The percentage of pixels above the JS ratio.
                          example: 43.704340352385046
                    example:
                    - js: 12
                      percentage: 0
                    - js: 9
