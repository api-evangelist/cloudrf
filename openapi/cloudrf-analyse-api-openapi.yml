openapi: 3.2.0
info:
  title: CloudRF Analyse API
  description: The CloudRF API enables users to model and test radio propagation for any radio, anywhere. Authenticate by passing your API key in the request header as `key`. Set up a CloudRF.com account to generate this key. All data is transferred as JSON. For detailed documentation, visit docs.cloudrf.com.
  termsOfService: https://cloudrf.com/terms-and-conditions/
  contact:
    email: support@cloudrf.com
  version: '3.36'
servers:
- url: https://api.cloudrf.com
  description: Production environment
- url: https://dev.cloudrf.com
  description: Development environment
security:
- ApiKeyAuth: []
tags:
- name: Analyse
  description: This set of endpoints allows the user to use and analyse information from pre-defined networks and layers.
paths:
  /bsa:
    post:
      operationId: bsa
      tags:
      - Analyse
      summary: Find the best site within an area
      description: 'The best site analysis (BSA) endpoint can be used to find the best locations in a wider area for a transmitter.

        It uses a GPU accelerated Monte Carlo simulation with hundreds of random locations to compare and grade radio intervisibility.

        Please note that the response of a BSA calculation is not signal strength. It is a normalised heatmap, relative to the best site, with settings for a user defined transmitter.

        For best results, focus onto a single feature, like a valley or a ridge, not an entire mountain range.


        There are two methods to define an area of interest for a BSA caluclation:


        1. Specify the `transmitter.lat` and `transmitter.lon`, along with the `output.rad` to define the circular area of interest.

        2. Pass in an array of `edges`, each with a `lat` and `lon` which defines the area of interest. When using this method, you should ensure that the `transmitter.lat` and `transmitter.lon` are not set.


        The response for BSA is a greyscale image.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site:
                  description: Name of site.
                  type: string
                  default: BSA
                  minLength: 1
                  maxLength: 24
                network:
                  description: Network name/group.
                  type: string
                  default: BSA
                  minLength: 1
                  maxLength: 24
                transmitter:
                  $ref: '#/components/schemas/Transmitter'
                edges:
                  description: An array of edges which can be used to define a bounding box for your area of interest for BSA. When using this please remove your transmitter.lat and transmitter.lon values.
                  properties:
                    lat:
                      description: Latitude of edge in WGS84 decimal degrees.
                      type: number
                      format: float
                      minimum: -89
                      maximum: 89
                      default: 0
                      example: 0
                    lon:
                      description: Longitude of edge in WGS84 decimal degrees.
                      type: number
                      format: float
                      minimum: -180
                      maximum: 180
                      default: 0
                      example: 0
                  example:
                  - lat: 38.90932
                    lon: 1.43935
                  - lat: 38.902789
                    lon: 1.436619
                  - lat: 38.905711
                    lon: 1.424938
                  - lat: 38.903652
                    lon: 1.419708
                  - lat: 38.911647
                    lon: 1.42024
                  - lat: 38.910872
                    lon: 1.434714
                antenna:
                  $ref: '#/components/schemas/Antenna'
                receiver:
                  type: object
                  properties:
                    alt:
                      description: Altitude of receiver above ground level in `metric` or `imperial`. Distance unit set in `output` object.
                      type: number
                      format: integer
                      minimum: 1
                      maximum: 120000
                      default: 1
                      example: 1
                    rxg:
                      description: Receiver antenna gain in dBi.
                      type: number
                      format: float
                      minimum: -10
                      maximum: 60
                      default: 2.15
                      example: 3
                output:
                  type: object
                  properties:
                    units:
                      description: 'Define global distance units applied to heights and distances:

                        * `metric` - Define units in meters and kilometers.

                        * `imperial` - Define units in feet and miles.

                        '
                      type: string
                      default: metric
                      enum:
                      - metric
                      - imperial
                    res:
                      description: Resolution in meters for produced output. A high resolution (eg. 2m) is much slower than a medium resolution (eg. 20m) for area calculations.
                      type: number
                      format: integer
                      minimum: 1
                      maximum: 300
                      default: 10
                      example: 20
                    rad:
                      description: Radius in kilometers for output. This is how far the area of your BSA calculation you wish to reach.
                      type: number
                      format: float
                      minimum: 0.03
                      maximum: 400
                      default: 5
                      example: 5
      responses:
        '200':
          description: Success - JSON object returned containing greyscale image URLs, color key values, and calculation statistics.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the results of the /bsa call.
                properties:
                  tiff:
                    type: string
                    format: uri
                    description: URL to GeoTIFF image file applying the WGS84 standard.
                    example: https://api.cloudrf.com/archive/bjdRdXlOUUpJV0FEOGpwUFh5bS91QT09/tiff
                  tiff_3857:
                    type: string
                    format: uri
                    description: URL to GeoTIFF image file applying the Mercartor projection standard.
                    example: https://api.cloudrf.com/archive/bjdRdXlOUUpJV0FEOGpwUFh5bS91QT09/tiff-3857
                  tiff_4326:
                    type: string
                    format: uri
                    description: URL to GeoTIFF image file applying the WGS84 standard.
                    example: https://api.cloudrf.com/archive/bjdRdXlOUUpJV0FEOGpwUFh5bS91QT09/tiff
                  kmz:
                    type: string
                    format: uri
                    description: URL to KMZ file.
                    example: https://api.cloudrf.com/archive/bjdRdXlOUUpJV0FEOGpwUFh5bS91QT09/kmz
                  shp:
                    type: string
                    format: uri
                    description: URL to ESRI Shapefile.
                    example: https://api.cloudrf.com/archive/bjdRdXlOUUpJV0FEOGpwUFh5bS91QT09/shp
                  json:
                    type: string
                    format: uri
                    description: URL to GeoJSON.
                    example: https://api.cloudrf.com/archive/bjdRdXlOUUpJV0FEOGpwUFh5bS91QT09/json
                  zip:
                    type: string
                    format: uri
                    description: URL to ATAK Mission Package.
                    example: https://api.cloudrf.com/archive/bjdRdXlOUUpJV0FEOGpwUFh5bS91QT09/zip
                  url:
                    type: string
                    format: uri
                    description: URL to view layer on a map in a browser.
                    example: https://api.cloudrf.com/archive/calc?id=bjdRdXlOUUpJV0FEOGpwUFh5bS91QT09
                  PNG_Mercator:
                    type: string
                    format: uri
                    description: URL to PNG image file applying the Mercartor projection standard.
                    example: https://api.cloudrf.com/output/projection/3857/1/0805143742_BSA_BSA
                  PNG_WGS84:
                    type: string
                    format: uri
                    description: URL to PNG image file applying the WGS84 standard.
                    example: https://api.cloudrf.com/users/1/0805143742_BSA_BSA.4326.png
                  bounds:
                    type: array
                    description: A list of image bounds as WGS84 decimal degrees. Order is clockwise from North,East,South,West.
                    items:
                      type: integer
                      format: float
                      example:
                      - 38.96091398221914
                      - 1.5057877843205172
                      - 38.871086017780854
                      - 1.3902122156794827
                  id:
                    type: string
                    description: Unique system identifier for the calculation. This is a one-up number from the main log table.
                    example: 4371076
                  sid:
                    type: string
                    description: Private unique system identifier for the calculation. This is a hash of the one-up number from the main log table intended for public maps etc.
                    example: bjdRdXlOUUpJV0FEOGpwUFh5bS91QT09
                  area:
                    type: string
                    description: Coverage area measured in kilometers squared.
                    example: 0
                  coverage:
                    type: string
                    description: Site efficiency computed from requested radius versus actual coverage area. A perfect circle out at sea would be 100% efficient.
                    example: 0
                  key:
                    type: array
                    description: Array of objects describing the RGB color schema as signal level in %, red, green and blue where red would be rgb(255,0,0).
                    items:
                      type: object
                      properties:
                        l:
                          type: string
                          description: Best site value percentage
                          example: 70%
                        r:
                          description: RED colour intensity. 0 to 255.
                          type: integer
                          example: 255
                        g:
                          description: GREEN colour intensity. 0 to 255.
                          type: integer
                          example: 19
                        b:
                          description: BLUE colour intensity. 0 to 255.
                          type: integer
                          example: 0
                      example:
                      - l: 100%
                        r: 107
                        g: 254
                        b: 1
                      - l: 90%
                        r: 147
                        g: 251
                        b: 5
                      - l: 80%
                        r: 184
                        g: 248
                        b: 8
                      - l: 70%
                        r: 219
                        g: 244
                        b: 12
                      - l: 60%
                        r: 241
                        g: 230
                        b: 16
                      - l: 50%
                        r: 237
                        g: 192
                        b: 20
                      - l: 40%
                        r: 234
                        g: 157
                        b: 23
                      - l: 30%
                        r: 230
                        g: 124
                        b: 27
                      - l: 20%
                        r: 227
                        g: 64
                        b: 34
                      - l: 10%
                        r: 223
                        g: 64
                        b: 34
                      - l: 00%
                        r: 220
                        g: 38
                        b: 38
                  elapsed:
                    description: Time taken for API call (milliseconds).
                    type: number
                    format: int32
                    example: 1572
                  balance:
                    description: API call credit usage. Only applies to public system.
                    type: integer
                    format: int32
                    example: 1
  /merge:
    get:
      operationId: merge
      tags:
      - Analyse
      summary: Merge sites into a super layer
      description: 'This endpoint returns a consolidated layer of many `area` calculations as a single super layer.

        Stronger signals are promoted over weaker ones regardless of colour schema but units must match eg. dBm.

        Merging a dozen sites should take only a few seconds.

        Merging a large network or at very high resolution can take minutes. If you experience a timeout on a long running API request it can still succeed later if you check back in your archive.'
      parameters:
      - in: query
        name: network
        schema:
          type: string
          description: Network name.
          example: 100_repeaters_nationwide.
        required: true
      - in: query
        required: true
        name: name
        schema:
          type: string
          description: Super layer name.
          example: National_map
      responses:
        '200':
          description: Success.
  /interference:
    post:
      operationId: interference
      tags:
      - Analyse
      summary: Find interference for two networks
      description: This endpoint compares a set pre-calculated 'signal' sites with a set of pre-calculated 'noise' sites to calculate the Jamming-to-Signal ratio, considering frequency, power and bandwidth. Signal sites can be specified with either a network name `s_network` or an array of site names `s_sites`, jammers are specified similarly with `j_network` and `j_sites`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                s_network:
                  description: Name of the 'signal' network.
                  type: string
                  example: MyNetwork
                s_sites:
                  description: A list of 'signal' sites.
                  type: array
                  items:
                    type: string
                  example:
                  - 1125164804_MyNetwork_A
                  - 1125164815_MyNetwork_B
                j_network:
                  description: Name of the 'noise' network.
                  type: string
                  example: OtherNetwork
                j_sites:
                  description: A list of "noise" sites which are potentially interfering.
                  type: array
                  items:
                    type: string
                  example:
                  - 1125164804_OtherNetwork_A
                  - 1125164815_OtherNetwork_B
                name:
                  description: Interference layer name.
                  type: string
                  example: InterferenceExample
                colour_key:
                  description: Colour key name.
                  type: string
                  example: JS.dB
      responses:
        '200':
          description: Success - JSON object returned containing image URLs, colour key values, and calculation statistics.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the results of the /interference call.
                properties:
                  tiff:
                    type: string
                    format: uri
                    description: URL to GeoTIFF image file applying the WGS84 standard.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz10/tiff
                  tiff_3857:
                    type: string
                    format: uri
                    description: URL to GeoTIFF image file applying the Mercartor projection standard.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz10/tiff-3857
                  tiff_4326:
                    type: string
                    format: uri
                    description: URL to GeoTIFF image file applying the WGS84 standard.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz10/tiff
                  kmz:
                    type: string
                    format: uri
                    description: URL to KMZ file.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz10/kmz
                  shp:
                    type: string
                    format: uri
                    description: URL to Shapefile.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz10/shp
                  json:
                    type: string
                    format: uri
                    description: URL to GeoJSON.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz10/json
                  zip:
                    type: string
                    format: uri
                    description: URL to ATAK Mission Package.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz10/zip
                  url:
                    type: string
                    format: uri
                    description: URL to view layer on a map in a browser.
                    example: https://api.cloudrf.com/archive/calc?id=bjRRWno0aUF3ekN2QW9ISWc2UlcrZz10
                  PNG_Mercator:
                    type: string
                    format: uri
                    description: URL to PNG image file applying the Mercartor projection standard.
                    example: https://api.cloudrf.com/output/projection/3857/1/1126153752_InterferenceExample_QRM
                  PNG_WGS84:
                    type: string
                    format: uri
                    description: URL to PNG image file applying the WGS84 standard.
                    example: https://api.cloudrf.com/users/1/1126153752_InterferenceExample_QRM.4326.png
                  bounds:
                    type: array
                    description: A list of image bounds as WGS84 decimal degrees. Order is clockwise from North,East,South,West.
                    items:
                      type: integer
                      format: float
                      example:
                      - 51.99872
                      - -2.186565
                      - 51.78911
                      - -2.396179
                  id:
                    type: string
                    description: Unique system identifier for the calculation. This is a one-up number from the main log table.
                    example: 3930917
                  sid:
                    type: string
                    description: Private unique system identifier for the calculation. This is a hash of the one-up number from the main log table intended for public maps etc.
                    example: bjRRWno0aUF3ekN2QW9ISWc2UlcrZz10
                  key:
                    type: array
                    description: Array of objects describing the RGB color schema as signal level in dB/dBm/dBuV, red, green and blue where red would be rgb(255,0,0).
                    items:
                      type: object
                      properties:
                        l:
                          type: string
                          description: Received signal power in dBm
                          example: -20dBm
                        r:
                          description: RED colour intensity. 0 to 255.
                          type: integer
                          example: 255
                        g:
                          description: GREEN colour intensity. 0 to 255.
                          type: integer
                          example: 19
                        b:
                          description: BLUE colour intensity. 0 to 255.
                          type: integer
                          example: 0
                      example:
                      - l: 12dB
                        r: 254
                        g: 0
                        b: 0
                      - l: 11dB
                        r: 254
                        g: 21
                        b: 0
                      - l: 10dB
                        r: 254
                        g: 43
                        b: 0
                      - l: 9dB
                        r: 254
                        g: 64
