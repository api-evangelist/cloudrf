                  elapsed:
                    description: Time taken for API call (milliseconds).
                    type: number
                    format: int32
                    example: 1572
                  balance:
                    description: API call credit usage. Only applies to the public system.
                    type: integer
                    format: int32
                    example: 1
                  calculation_adjusted:
                    type: array
                    description: An array of messages indicating if a calculation was adjusted due to account limitations or restrictions on settings.
                    items:
                      type: string
                      example:
                      - Resolution has been reduced from 30m to 54m due to your plan. Your proposed calculation would exceed your plans megapixel limit of 5MP.
                      - 10m landcover is disabled for calculations with a radius greater than 50KM.
                      - 10m landcover is disabled for calculations with a resolution of greater than 30m.
                      - 3D buildings are disabled for calculations with a radius greater than 20KM.
                      - 3D buildings are disabled for calculations with a resolution greater than 30m.
  /path:
    post:
      operationId: path
      description: This endpoint allows users to analyse a point-to-point path. A path profile is a single link from A to B. A basic request requires transmitter, receiver, antenna, and output objects; providing the model and environment objects enhances accuracy.
      tags:
      - Create
      summary: Point-to-point (Tx to Rx)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site:
                  description: Site name.
                  type: string
                  default: Link
                  minLength: 2
                  maxLength: 50
                network:
                  description: Network name/group.
                  type: string
                  default: Testing
                  minLength: 2
                  maxLength: 50
                transmitter:
                  $ref: '#/components/schemas/Transmitter'
                antenna:
                  $ref: '#/components/schemas/Antenna'
                receiver:
                  $ref: '#/components/schemas/Receiver'
                model:
                  $ref: '#/components/schemas/Model'
                environment:
                  $ref: '#/components/schemas/Environment'
                output:
                  $ref: '#/components/schemas/Output'
              required:
              - transmitter
              - receiver
              - antenna
              - output
            examples:
              example-path:
                value:
                  site: Link
                  network: Testing
                  transmitter:
                    lat: 38.916
                    lon: 1.448
                    alt: 1
                    frq: 446
                    txw: 1
                    bwi: 1
                  antenna:
                    txg: 2.15
                    txl: 0
                    ant: 0
                    azi: 90
                    tlt: 1
                    fbr: 0
                    hbw: 120
                    vbw: 30
                    pol: v
                  receiver:
                    lat: 38.906986
                    lon: 1.421416
                    alt: 0.1
                    rxg: 3
                    rxs: -100
                  model:
                    pm: 4
                    pe: 2
                    ked: 4
                    rel: 50
                  environment:
                    clt: Minimal.clt
                    elevation: 1
                    landcover: 0
                    buildings: 0
                    obstacles: 0
                  output:
                    units: m
                    col: RAINBOW.dBm
                    out: 2
                    ber: 2
                    mod: 7
                    nf: -100
                    res: 20
      responses:
        '200':
          description: Success - JSON object returned containing detailed link measurements in different units and arrays for plotting of profile, obstructions, path loss, and landcover.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the results of the /path call.
                properties:
                  Engine:
                    type: string
                    description: Engine version string used to perform the calculation
                    example: Sleipnir 1.18
                  Frequency MHz:
                    description: Center frequency in megahertz.
                    type: number
                    format: float
                    example: 868
                  Propagation model:
                    description: "Propagation model: \n* `1` - Irregular Terrain Model (ITM) (Longley-Rice)\n* `2` - Line of Sight (LOS)\n* `3` - Okumura-Hata \n* `4` - ITU-R P.1812\n* `5` - SUI Microwave\n* `6` - COST231-Hata\n* `7` - ITU-R P.525 (Free space path loss)\n* `8` - RADAR\n* `9` - Ericsson 9999\n* `10` - General Purpose\n* `11` - Egli VHF/UHF\n* `12` - HF NVIS\n"
                    type: string
                    example: ITM
                  Earth dielectric constant:
                    description: 'ITM model only (Reference https://www.qsl.net/n9zia/conduct.html):

                      * `3` - City/Industrial

                      * `5` - City

                      * `13` - Mountain / Sand

                      * `15` - Average ground / Arable

                      * `25` - Good ground

                      * `80` - Water

                      '
                    type: number
                    format: float
                    example: 14
                  Earth conductivity:
                    description: ITM model only. Corresponding conductivity measured in S/m ranging from 0.001 to 5.0. Reference https://www.qsl.net/n9zia/conduct.html
                    type: number
                    format: float
                    example: 0.01
                  Radio climate:
                    description: "ITM model only. ITU climate codes. \n* `1` - Equatorial\n* `2` - Continental Subtropical\n* `3` - Maritime Subtropical\n* `4` - Desert\n* `5` - Continental Temperate\n* `6` - Maritime Temperate (Land)\n* `7` - Maritime Temperate (Sea)\n"
                    type: string
                    enum:
                    - Equatorial (Congo)
                    - Continental Subtropical (Sudan)
                    - Maritime Subtropical (West coast of Africa)
                    - Desert (Sahara)
                    - Continental Temperate
                    - Maritime Temperate (Land)
                    - Maritime Temperate (Sea)
                    example: Maritime Temperate (Land)
                  Atmospheric bending constant:
                    description: ITM model only. Number describing atmospheric refractive index.
                    type: number
                    format: Int32
                    example: 301
                  Fraction of situations:
                    description: ITM model only. Reliability value for a given location in percentage.
                    type: number
                    format: Int32
                    example: 90
                  Fraction of time:
                    description: ITM model only. Reliability value for a given time in percentage.
                    type: number
                    format: Int32
                    example: 90
                  Receiver:
                    type: object
                    properties:
                      Latitude:
                        description: Receiver's latitude provided in call in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 38.90699
                      Longitude:
                        description: Receiver's longitude provided in call in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 1.421416
                      Ground elevation m:
                        description: Ground elevation above mean sea level (AMSL) in either meters or feet as set by distance units.
                        type: number
                        format: float
                        example: 13
                      Antenna height m:
                        description: Antenna height above ground level in meters or feet as provided in API call.
                        type: number
                        format: float
                        example: 0.1
                      Receiver gain dBd:
                        description: Receive antenna gain measured in decibels relative to a dipole antenna (2.15dB). 0dBd = 2.15dBi
                        type: number
                        format: float
                        example: 0.85
                      Receiver gain dBi:
                        description: Receive antenna gain measured in decibels relative to an isotropic antenna (0dB). 0dBd = 2.15dBi
                        type: number
                        format: float
                        example: 3
                  Transmitters:
                    type: object
                    properties:
                      Latitude:
                        description: Latitude of transmitter in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 38.916
                      Longitude:
                        description: Longitude of transmitter in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 1.448
                      Ground elevation m:
                        description: Ground elevation above mean sea level (AMSL) in either meters or feet as set by distance units.
                        type: number
                        format: float
                        example: 0
                      Antenna height m:
                        description: Antenna height above ground level in meters or feet as provided in API call.
                        type: number
                        format: float
                        example: 1
                      Height above sea level m:
                        description: Antenna height above sea level in meters or feet as provided in API call.
                        type: number
                        format: float
                        example: 2
                      Distance to receiver km:
                        description: Distance between transmitter and receiver in kilometers OR miles measured from the base of the antennas. Units determined within output object.
                        type: number
                        format: float
                        example: 2.512
                      Azimuth to receiver deg:
                        description: Angle in degrees referenced to grid north from the transmitter base to the receiver base.
                        type: number
                        format: float
                        example: 246.46
                      Downtilt angle deg:
                        description: Angle in degrees from the transmitter to the receiver relative the horizon (0.0). A positive value is below the horizon (looking downhill).
                        type: number
                        format: float
                        example: 0.3
                      Antenna gain dBd:
                        description: Transmit antenna gain measured in decibels relative to a dipole antenna (2.15dB). 0dBd = 2.15dBi
                        type: number
                        format: float
                        example: -1
                      Antenna gain dBi:
                        description: Transmit antenna gain measured in decibels relative to a isotropic antenna (0dB). 0dBd = 2.15dBi
                        type: number
                        format: float
                        example: 1.15
                      Polarisation:
                        description: Antenna polarisation as requested. Either Horizontal or Vertical.
                        type: string
                        example: Horizontal
                      Power W:
                        description: Transmit power before antenna measured in Watts.
                        type: number
                        format: float
                        example: 0.1
                      Power dBm:
                        description: Transmit power before antenna measured in decibel milliwatts
                        type: string
                        example: 21.15
                      ERP W:
                        description: Transmitter Effective Radiated Power (dipole) after antenna gain in Watts.
                        type: number
                        format: float
                        example: 0.08
                      EIRP W:
                        description: Transmitter Effective Isotropic Radiated Power (isotropic) after antenna gain in Watts.
                        type: number
                        format: float
                        example: 0.13
                      ERP dBm:
                        description: Transmitter Effective Radiated Power (dipole) after antenna gain in decibel milliwatts
                        type: number
                        format: float
                        example: 19
                      EIRP dBm:
                        description: Transmitter Effective Isotropic Radiated Power (isotropic) after antenna gain in decibel milliwatts
                        type: number
                        format: float
                        example: 21.15
                      Free space path loss dB:
                        description: Pure link path loss using ITU-R P.525 measured in decibels
                        type: number
                        format: float
                        example: 95.1
                      Bandwidth MHz:
                        description: Signal bandwidth measured in megahertz
                        type: number
                        format: float
                        example: 1
                      Johnson Nyquist noise dB:
                        description: Johnson Nyquist noise measured in decibels (dB)
                        type: number
                        format: float
                        example: 10.2
                      Noise floor dBm:
                        description: Noise floor measured in decibel milliwatts (dBm)
                        type: number
                        format: float
                        example: -100
                      Channel noise dBm:
                        description: Noise floor measured in decibel milliwatts (dBm)
                        type: number
                        format: float
                        example: -89.8
                      Signal power at receiver dBm:
                        description: Received signal power at receiver measured in decibel milliwatts (dBm)
                        type: number
                        format: float
                        example: -205.6
                      Signal to Noise Ratio dB:
                        description: Signal to noise ratio measured in decibels (dB)
                        type: number
                        format: float
                        example: -115.8
                      Computed path loss dB:
                        description: Total computed path loss at receiver (including gains/losses) measured in decibels (dB)
                        type: number
                        format: float
                        example: 225.6
                      Model attenuation dB:
                        description: Additional path loss from the propagation model, measured in decibels
                        type: number
                        format: float
                        example: 130.6
                      Field strength at receiver dBuV/m:
                        description: Field strength at receiver measured in decibel microvolts per meter.
                        type: number
                        format: float
                        example: -68.5
                      RX voltage 50 ohm dipole uV:
                        description: Received power reference to a 50 ohm dipole measured in micro volts
                        type: number
                        format: float
                        example: 0
                      RX voltage 50 ohm dipole dBuV:
                        description: Received power reference to a 50 ohm dipole measured in decibel micro volts
                        type: number
                        format: float
                        example: -95
                      RX voltage 75 ohm dipole uV:
                        description: Received power reference to a 75 ohm dipole measured in micro volts
                        type: number
                        format: float
                        example: 0
                      RX voltage 75 ohm dipole dBuV:
                        description: Received power reference to a 75 ohm dipole measured in decibel micro volts
                        type: number
                        format: float
                        example: -94
                      Raise RX antenna for LOS:
                        description: Calculated height adjustment necessary to achieve line of sight in either meters or feet
                        type: number
                        format: float
                        example: 100.1
                      Raise RX antenna for fresnel 60%:
                        description: Calculated height adjustment necessary to clear 60% of the fresnel zone in either meters or feet
                        type: number
                        format: float
                        example: 313.1
                      Raise RX antenna for full fresnel:
                        description: Calculated height adjustment necessary to clear 100% of the fresnel zone in either meters or feet
                        type: number
                        format: float
                        example: 445.1
                      Obstructions:
                        description: Array of WGS84 latitude + longitude pairs describing obstructions along a path.
                        type: array
                        items:
                          type: object
                          properties:
                            '0':
                              description: Latitude value of obstruction in WGS84 projection.
                              type: number
                              format: float
                            '1':
                              description: Longitude value of obstruction in WGS84 projection.
                              type: number
                              format: float
                        example:
                        - - 38.90701
                          - 1.421483
                        - - 38.90708
