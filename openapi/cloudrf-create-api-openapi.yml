  /points:
    post:
      operationId: points
      description: 'This endpoint allows users to test many point-to-point links in one call. The points function tests an array of transmitters to one receiver and is designed for route analysis and dynamic modelling. The simplest request requires: transmitter values, points array of tuples (latitude, longitude, altitude), generic antenna, receiver, and output objects defined. Model and environment options enhance accuracy.'
      tags:
      - Create
      summary: Multiple radios to one receiver (many Tx, one Rx)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site:
                  description: Name of site.
                  type: string
                  default: Points
                  minLength: 2
                  maxLength: 50
                network:
                  description: Network name/group.
                  type: string
                  default: Testing
                  minLength: 2
                  maxLength: 50
                transmitter:
                  $ref: '#/components/schemas/Transmitter'
                points:
                  type: array
                  items:
                    $ref: '#/components/schemas/Point'
                antenna:
                  $ref: '#/components/schemas/Antenna'
                receiver:
                  $ref: '#/components/schemas/Receiver'
                model:
                  $ref: '#/components/schemas/Model'
                environment:
                  $ref: '#/components/schemas/Environment'
                output:
                  $ref: '#/components/schemas/Output'
            examples:
              example-points:
                value:
                  site: Points
                  network: Testing
                  transmitter:
                    frq: 446
                    txw: 1
                    bwi: 0.1
                  points:
                  - lat: 38.916
                    lon: 1.411
                    alt: 1
                  - lat: 38.916
                    lon: 1.411
                    alt: 1
                  antenna:
                    txg: 2.15
                    txl: 0
                    ant: 39
                    azi: 0
                    tlt: 0
                    hbw: 0
                    vbw: 0
                    pol: v
                  receiver:
                    lat: 38.906986
                    lon: 1.421416
                    alt: 0.1
                    rxg: 2.15
                    rxs: -90
                  model:
                    pm: 1
                    pe: 2
                    ked: 0
                    rel: 95
                  environment:
                    clt: Minimal.clt
                    elevation: 1
                    landcover: 0
                    buildings: 0
                    obstacles: 0
                  output:
                    units: m
                    out: 2
                    ber: 0
                    mod: 1
                    nf: -104
                    res: 20
      responses:
        '200':
          description: Success - JSON object returned with an array of transmitters; each containing a truncated path output with signal strength measurements and relevant geometry.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the results of the /points call.
                properties:
                  Engine:
                    type: string
                    description: The version of the engine which produced the output
                    example: Sleipnir 1.18
                  Frequency MHz:
                    description: Center frequency in megahertz.
                    type: number
                    format: float
                    example: 868
                  Propagation model:
                    description: "Propagation model: \n* `1` - Irregular Terrain Model (ITM) (Longley-Rice)\n* `2` - Line of Sight (LOS)\n* `3` - Okumura-Hata \n* `4` - ITU-R P.1812\n* `5` - SUI Microwave\n* `6` - COST231-Hata\n* `7` - ITU-R P.525 (Free space path loss)\n* `8` - RADAR\n* `9` - Ericsson 9999\n* `10` - General Purpose\n* `11` - Egli VHF/UHF\n* `12` - HF NVIS\n"
                    type: string
                    example: ITM
                  Earth dielectric constant:
                    description: "ITM model only: \n* `3` - City/Industrial\n* `5` - City\n* `13` - Mountain / Sand\n* `15` - Average ground / Arable\n* `25` - Good ground\n* `80` - Water\nRef https://www.qsl.net/n9zia/conduct.html\n"
                    type: number
                    format: float
                    example: 14
                  Earth conductivity:
                    description: ITM model only. Corresponding conductivity measured in S/m ranging from 0.001 to 5.0. Ref https://www.qsl.net/n9zia/conduct.html
                    type: number
                    format: float
                    example: 0.01
                  Radio climate:
                    description: ITM model only. ITU climate codes. 1 = Equatorial, 2 = Continental Subtropical, 3 = Maritime Subtropical, 4 = Desert, 5 = Continental Temperate, 6 = Maritime temperate (Land), 7 = Maritime temperate (sea)
                    type: string
                    enum:
                    - Equatorial (Congo)
                    - Continental Subtropical (Sudan)
                    - Maritime Subtropical (West coast of Africa)
                    - Desert (Sahara)
                    - Continental Temperate
                    - Maritime Temperate (Land)
                    - Maritime Temperate (Sea)
                    example: Maritime Temperate (Land)
                  Atmospheric bending constant:
                    description: ITM model only. Number describing atmospheric refractive index. Default is 301
                    type: number
                    format: Int32
                    example: 301
                  Fraction of situations:
                    description: ITM model only. Reliability value for a given location. Default is 90%
                    type: number
                    format: Int32
                    example: 90
                  Fraction of time:
                    description: ITM model only. Reliability value for a given time. Default is 90%
                    type: number
                    format: Int32
                    example: 90
                  Receiver:
                    type: object
                    properties:
                      Latitude:
                        description: Receiver's latitude provided in call in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 38.90699
                      Longitude:
                        description: Receiver's longitude provided in call in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 1.421416
                      Ground elevation m:
                        description: Ground elevation above mean sea level (AMSL) in either meters or feet as set by distance units.
                        type: number
                        format: float
                        example: 22
                      Antenna height m:
                        description: Antenna height above ground level in meters or feet as provided in API call.
                        type: number
                        format: float
                        example: 1
                      Receiver gain dBd:
                        description: Receive antenna gain measured in decibels relative to a dipole antenna (2.15dB). 0dBd = 2.15dBi
                        type: number
                        format: float
                        example: 0
                      Receiver gain dBi:
                        description: Receive antenna gain measured in decibels relative to an isotropic antenna (0dB). 0dBd = 2.15dBi
                        type: number
                        format: float
                        example: 2.15
                  Transmitters:
                    type: object
                    properties:
                      Latitude:
                        description: Latitude of transmitter in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 38.916
                      Longitude:
                        description: Longitude of transmitter in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 1.448
                      Ground elevation m:
                        description: Ground elevation above mean sea level (AMSL) in either meters or feet as set by distance units.
                        type: number
                        format: float
                        example: 1
                      Antenna height m:
                        description: Antenna height above ground level in meters or feet as provided in API call.
                        type: number
                        format: float
                        example: 1
                      Height above sea level m:
                        description: Antenna height above sea level in meters or feet as provided in API call.
                        type: number
                        format: float
                        example: 2
                      Distance to receiver km:
                        description: Distance between transmitter and receiver in kilometers OR miles measured from the base of the antennas. Units determined within output object.
                        type: number
                        format: float
                        example: 2.512
                      Azimuth to receiver deg:
                        description: Angle in degrees referenced to grid north from the transmitter base to the receiver base.
                        type: number
                        format: float
                        example: 246.46
                      Downtilt angle deg:
                        description: Angle in degrees from the transmitter to the receiver relative the horizon (0.0). A positive value is below the horizon (looking downhill).
                        type: number
                        format: float
                        example: 0
                      Antenna gain dBd:
                        description: Transmit antenna gain measured in decibels relative to a dipole antenna (2.15dB). 0dBd = 2.15dBi
                        type: number
                        format: float
                        example: 0
                      Antenna gain dBi:
                        description: Transmit antenna gain measured in decibels relative to a isotropic antenna (0dB). 0dBd = 2.15dBi
                        type: number
                        format: float
                        example: 2.15
                      Polarisation:
                        description: Antenna polarisation as requested. Either Horizontal or Vertical.
                        type: string
                        example: Horizontal
                      Power W:
                        description: Transmit power before antenna measured in Watts.
                        type: number
                        format: float
                        example: 2
                      Power dBm:
                        description: Transmit power before antenna measured in decibel milliwatts
                        type: string
                        example: 35.16
                      ERP W:
                        description: Transmitter Effective Radiated Power (dipole) after antenna gain in Watts.
                        type: number
                        format: float
                        example: 2
                      EIRP W:
                        description: Transmitter Effective Isotropic Radiated Power (isotropic) after antenna gain in Watts.
                        type: number
                        format: float
                        example: 3.28
                      ERP dBm:
                        description: Transmitter Effective Radiated Power (dipole) after antenna gain in decibel milliwatts
                        type: number
                        format: float
                        example: 3.28
                      EIRP dBm:
                        description: Transmitter Effective Isotropic Radiated Power (isotropic) after antenna gain in decibel milliwatts
                        type: number
                        format: float
                        example: 35.16
                      Free space path loss dB:
                        description: Path loss using the ITU-R P.525 reference model measured in decibels. This represents the best possible signal.
                        type: number
                        format: float
                        example: 92
                      Bandwidth MHz:
                        description: Signal bandwidth measured in megahertz
                        type: number
                        format: float
                        example: 1
                      Signal power at receiver dBm:
                        description: Received signal power at receiver measured in decibel milliwatts (dBm)
                        type: number
                        format: float
                        example: -128.9
                      Signal to Noise Ratio dB:
                        description: Signal to noise ratio measured in decibels (dB)
                        type: number
                        format: float
                        example: -115.8
                      Computed path loss dB:
                        description: Total computed path loss at receiver (including gains/losses) measured in decibels (dB)
                        type: number
                        format: float
                        example: 225.6
                      Model attenuation dB:
                        description: Additional path loss from the propagation model, measured in decibels
                        type: number
                        format: float
                        example: 130.6
                      Field strength at receiver dBuV/m:
                        description: Field strength at receiver measured in decibel microvolts per meter.
                        type: number
                        format: float
                        example: -68.5
                      Raise RX antenna for LOS:
                        description: Calculated height adjustment necessary to achieve line of sight in either meters or feet
                        type: number
                        format: float
                        example: 0
                      Raise RX antenna for fresnel 60%:
                        description: Calculated height adjustment necessary to clear 60% of the fresnel zone in either meters or feet
                        type: number
                        format: float
                        example: 5
                      Raise RX antenna for full fresnel:
                        description: Calculated height adjustment necessary to clear 100% of the fresnel zone in either meters or feet
                        type: number
                        format: float
                        example: 7
                      server:
                        description: Numerical identifier for this server / node. A points call with 100 nodes would return 100 servers numbered 1 to 100.
                        type: integer
                        format: int32
                        example: 1
                  calculation_adjusted:
                    type: array
                    description: An array of messages indicating if a calculation was adjusted due to account limitations or restrictions on settings.
                    items:
                      type: string
                    example: []
                  elapsed:
                    description: Time taken for API call (milliseconds).
                    type: number
                    format: Int32
                    example: 135
                  kmz:
                    type: string
                    format: uri
                    description: URL to KMZ file containing data for the transmitters.
                    example: https://api.cloudrf.com/API/archive/data?path=0728132101_Testing_PPA&uid=40843
                  json:
                    type: string
                    format: uri
                    description: URL to JSON containing metadata for the request.
                    example: https://api.cloudrf.com/users/40843/00728132101_Testing_PPA.json
  /multilink:
    post:
      operationId: multilink
      tags:
      - Create
      summary: Multiple mesh radios (many to many)
      description: The multilink function tests an array of radios, each with its own antenna, to each other and is designed for large/fast mesh networks. The simplest request requires an array of radios and output options like resolution. Model and environment options enhance accuracy. The response is terse for scale and you should use path or points for more metadata
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site:
                  description: Site name.
                  type: string
                  example: My multilink
                network:
                  description: Network name/group.
                  type: string
                  example: My multilink network
                model:
                  $ref: '#/components/schemas/Model'
                environment:
                  $ref: '#/components/schemas/Environment'
                Output:
                  type: object
                  properties:
                    units:
                      description: "Define the distance units applied to heights and distances:\n* `m` - Define units in (metric) meters and kilometers above ground level.\n* `m_amsl` - Define units in meters and kilometers above mean sea level.\n* `f` - Define units in (imperial) feet and miles above ground level.\n* `f_amsl` - Define units in (imperial) feet and miles above mean sea level.                   \n"
                      type: string
                      default: m
                      enum:
                      - m
                      - m_amsl
                      - f
                      - f_amsl
                    out:
                      description: 'Measured units (Please note that your measured unit should match the measured unit of your `col` colour schema):

                        * `1` - Path loss (dB)

                        * `2` - Received power (dBm) - Default

                        * `3` - Field strength (dBuV)

                        * `4` - Signal-to-Noise Ratio (dB) - Supports the `nf` option in the `output` object

                        * `6` - Reference Signal Received Power (dBm)

                        * `8` - Throughput (Mbps)

                        * `9` - Throughput (kbps)

                        '
                      type: number
                      format: integer
                      minimum: 1
                      maximum: 7
                      default: 2
                      example: 2
                      enum:
                      - 1
                      - 2
                      - 3
                      - 4
                      - 6
                    nf:
                      description: Noise floor in dBm for when using an SNR value (`4`) with `out` in the `output` object. You can either specify your value manually with a number, or you can specify `database` to use a noise map fitted to the noise stored in the database (see `/noise/create` and `/noise/get` for more details).
                      type: number
                      format: float
                      minimum: -150
                      maximum: -40
                      default: -120
                      example: -100
                    res:
                      description: Resolution in meters for produced output. A high resolution (eg. 2m) is much slower than a medium resolution (eg. 20m) for area calculations.
                      type: number
                      format: integer
                      minimum: 1
                      maximum: 300
                      default: 10
                      example: 20
              oneOf:
              - title: Radios
                properties:
                  radios:
                    description: Array of radios
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          description: Radio name.
                          type: string
                          example: A1
                        lat:
                          description: Latitude of transmitter in WGS84 decimal degrees.
                          type: number
                          format: float
                          example: 38.916
                        lon:
                          description: Longitude of transmitter in WGS84 decimal degrees.
                          type: number
                          format: float
                          example: 1.448
                        alt:
                          description: Altitude of transmitter above ground level in `metric` or `imperial`. Distance unit set in `output` object.
                          type: number
                          format: float
                          example: 1
                        frq:
                          description: Center frequency in megahertz.
                          type: number
                          format: float
                          example: 868
                        txw:
                          description: Transmitter power in watts before the antenna.
                          type: number
                          format: float
                          example: 0.1
                        bwi:
                          description: Bandwidth in MHz.
                          type: number
                          format: float
                          example: 1
                        nf:
                          description: Noise floor in dBm for when using an SNR value (`4`) with `out` in the `output` object. You can either specify your value manually with a number, or you can specify `database` to use a noise map fitted to the noise stored in the database (see `/noise/create` and `/noise/get` for more details).
                          type: number
                          format: float
                          minimum: -150
                          maximum: -40
                          default: -120
                          example: -100
                        antenna:
                          $ref: '#/components/schemas/Antenna'
              - title: Separate Tx/Rx
                properties:
                  transmitters:
                    description: Array of transmitters
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          description: Transmitter name.
                          type: string
                          example: T1
                        lat:
                          description: Latitude of transmitter in WGS84 decimal degrees.
                          type: number
                          format: float
                          example: 38.916
                        lon:
                          description: Longitude of transmitter in WGS84 decimal degrees.
                          type: number
                          format: float
                          example: 1.448
                        alt:
                          description: Altitude of transmitter above ground level in `metric` or `imperial`. Distance unit set in `output` object.
                          type: number
                          format: float
                          example: 1
                        frq:
                          description: Center frequency in megahertz.
                          type: number
                          format: float
                          example: 868
                        txw:
                          description: Transmitter power in watts before the antenna.
                          type: number
                          format: float
                          example: 0.1
                        bwi:
                          description: Bandwidth in MHz.
                          type: number
                          format: float
                          example: 1
                        antenna:
                          $ref: '#/components/schemas/Antenna'
                  receivers:
                    description: Array of receivers
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          description: Receiver name.
                          type: string
                          example: R1
                        lat:
                          description: Latitude of transmitter in WGS84 decimal degrees.
                          type: number
                          format: float
                          example: 38.916
                        lon:
                          description: Longitude of transmitter in WGS84 decimal degrees.
                          type: number
                          format: float
                          example: 1.448
                        alt:
                          description: Altitude of transmitter above ground level in `metric` or `imperial`. Distance unit set in `output` object.
                          type: number
                          format: float
                          example: 1
                        nf:
                          description: Noise floor in dBm for when using an SNR value (`4`) with `out` in the `output` object. You can either specify your value manually with a number, or you can specify `database` to use a noise map fitted to the noise stored in the database (see `/noise/create` and `/noise/get` for more details).
                          type: number
                          format: float
                          minimum: -150
                          maximum: -40
                          default: -120
                          example: -100
                        antenna:
                          $ref: '#/components/schemas/Antenna'
      responses:
        '200':
          description: Success - JSON object returned with an array of values indexed to match the request order. The first transmitter is 0 and 0->1 is the link from 0 to 1.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the results of the /multilink call.
                properties:
                  engine:
                    type: string
                    description: The version of the engine which produced the output
                    example: Sleipnir 1.19
                  license:
                    description: License information
                    type: string
                    example: Dipsy
                  elapsed:
                    description: Elapsed time in milliseconds
                    type: number
                    example: 100
                  calculation_adjusted:
                    description: Adjustments made to fit within server limits
                    type: string
                    example:
                    - Resolution reduced to 25m
                  values:
                    title: Point to point power values.
                    description: "Point to point power values, with keys are in format `{txName}->{rxName}`.\n Default names for radios are just `{index}`, for transmitters and receivers the default names are `t{index}` and `r{index}` respectively."
                    type: object
                    properties:
                      0->1:
                        type: number
                        example: '-83.123'
                      1->0:
                        type: number
                        example: '-83.123'
  /multisite:
    post:
      operationId: multisite
      tags:
      - Create
      summary: Multiple multipoint coverage heatmaps
      description: 'This powerful GPU endpoint allows you request multiple `area` calculations in one request and response. The layers are returned as a composite super layer.

        This is useful for planning adhoc radio networks with many radios efficiently.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                site:
                  description: Site name.
                  type: string
                  example: My multisite
                network:
                  description: Network name/group.
                  type: string
                  example: My multisite network
                transmitters:
                  description: Array of transmitters part of the multisite
                  type: array
                  items:
                    type: object
                    properties:
                      lat:
                        description: Latitude of transmitter in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 38.916
                      lon:
                        description: Longitude of transmitter in WGS84 decimal degrees.
                        type: number
                        format: float
                        example: 1.448
                      alt:
                        description: Altitude of transmitter above ground level in `metric` or `imperial`. Distance unit set in `output` object.
                        type: number
                        format: float
                        example: 1
                      frq:
                        description: Center frequency in megahertz.
                        type: number
                        format: float
                        example: 868
                      txw:
                        description: Transmitter power in watts before the antenna.
                        type: number
                        format: float
                        example: 0.1
                      bwi:
                        description: Bandwidth in MHz.
                        type: number
                        format: float
                        example: 1
                      remote:
                        description: Increases performance for transmitters far from the output bounds. Requires `output.bounds` to be set.
                        type: boolean
                        example: false
                      antenna:
                        $ref: '#/components/schemas/Antenna'
                receiver:
                  description: Details relating to the receiver in the request.
                  type: object
                  properties:
                    alt:
                      description: Altitude of transmitter above ground level in the units which you have defined in the `output` object.
                      type: number
                      format: float
                      example: 1
                    rxg:
                      description: Receiver antenna gain in dBi. Please note that when you use RADAR propagation model (`pm` value `8`) then receiver antenna gain is matched to the transmitter as this assumes a bi-static transceiver.
                      type: number
                      format: float
                      example: 3
                    rxs:
                      description: Receiver sensitivity/threshold in measured units. Measured units set in `output` object.
                      type: number
                      format: float
                      example: -90
                model:
                  $ref: '#/components/schemas/Model'
                environment:
                  $ref: '#/components/schemas/Environment'
                output:
                  $ref: '#/components/schemas/OutputWithBounds'
      responses:
        '200':
          description: Success - JSON object returned containing image URLs, colour key values, and calculation statistics.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the results of the /multisite call.
                properties:
                  tiff:
                    type: string
                    format: uri
                    description: URL to a GeoTIFF image file applying the WGS84 standard.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz09/tiff
                  tiff_3857:
                    type: string
                    format: uri
                    description: URL to a GeoTIFF image file applying the Mercartor projection standard.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz09/tiff-3857
                  tiff_4326:
                    type: string
                    format: uri
                    description: URL to a GeoTIFF image file applying the WGS84 standard.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz09/tiff
                  kmz:
                    type: string
                    format: uri
                    description: URL to a KMZ file.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz09/kmz
                  shp:
                    type: string
                    format: uri
                    description: URL to a ESRI Shapefile.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz09/shp
                  json:
                    type: string
                    format: uri
                    description: URL to GeoJSON.
                    example: https://api.cloudrf.com/archive/bjRRWno0aUF3ekN2QW9ISWc2UlcrZz09/json
                  zip:
                    type: string
                    format: uri
                    description: URL to ATAK Mission Package.
