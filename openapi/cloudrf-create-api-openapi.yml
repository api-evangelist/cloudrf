openapi: 3.2.0
info:
  title: CloudRF Create API
  description: The CloudRF API enables users to model and test radio propagation for any radio, anywhere. Authenticate by passing your API key in the request header as `key`. Set up a CloudRF.com account to generate this key. All data is transferred as JSON. For detailed documentation, visit docs.cloudrf.com.
  termsOfService: https://cloudrf.com/terms-and-conditions/
  contact:
    email: support@cloudrf.com
  version: '3.36'
servers:
- url: https://api.cloudrf.com
  description: Production environment
- url: https://dev.cloudrf.com
  description: Development environment
security:
- ApiKeyAuth: []
tags:
- name: Create
  description: This set of endpoints allows the user to create new links, site heatmaps, routes, and networks.
paths:
  /area:
    post:
      operationId: area
      description: 'This endpoint returns an omni-directional coverage plot (point-to-multipoint) as an image.

        This function assumes a consistent receiver height at all locations out to fixed radius.

        Speed can be improved by adjusting the resolution with the "res" parameter.

        A standard request requires a transmitter, receiver, antenna and output objects. Providing a model and environment enhances accuracy.'
      tags:
      - Create
      summary: Multipoint coverage heatmap
      requestBody:
        description: The request payload providing the site properties.
        content:
          application/json:
            schema:
              type: object
              properties:
                site:
                  description: Site name.
                  type: string
                  default: A1
                  minLength: 2
                  maxLength: 50
                network:
                  description: Network name/group.
                  type: string
                  default: Testing
                  minLength: 2
                  maxLength: 50
                engine:
                  description: 'Processing engine to handle the request:

                    * `1` - GPU (requires a GPU enabled server)

                    * `2` - CPU

                    '
                  type: number
                  format: float
                  default: 2
                  enum:
                  - 1
                  - 2
                transmitter:
                  allOf:
                  - $ref: '#/components/schemas/Transmitter'
                  - type: object
                    properties:
                      remote:
                        description: Increases performance for transmitters far from the output bounds. Requires `output.bounds` to be set.
                        type: boolean
                        example: false
                receiver:
                  $ref: '#/components/schemas/Receiver'
                antenna:
                  $ref: '#/components/schemas/Antenna'
                model:
                  $ref: '#/components/schemas/Model'
                environment:
                  $ref: '#/components/schemas/Environment'
                output:
                  $ref: '#/components/schemas/OutputWithBounds'
              required:
              - network
              - transmitter
              - receiver
              - antenna
              - output
            examples:
              example-area:
                value:
                  site: A1
                  network: Testing
                  transmitter:
                    lat: 38.916
                    lon: 1.448
                    alt: 2
                    frq: 446
                    txw: 1
                    bwi: 1
                  receiver:
                    lat: 0
                    lon: 0
                    alt: 2
                    rxg: 3
                    rxs: -100
                  antenna:
                    txg: 2.15
                    txl: 0
                    ant: 0
                    azi: 90
                    tlt: 1
                    hbw: 120
                    vbw: 30
                    pol: v
                  environment:
                    clt: Minimal.clt
                    elevation: 1
                    landcover: 0
                    buildings: 0
                    obstacles: 0
                  output:
                    units: metric
                    col: RAINBOW.dBm
                    out: 2
                    nf: -100
                    res: 10
                    rad: 5
      responses:
        '200':
          description: Success - JSON object returned containing image URLs, color key values, and calculation statistics.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the results of the /area call.
                properties:
                  tiff:
                    type: string
                    format: uri
                    description: URL to GeoTIFF image file in WGS84 projection
                    example: https://api.cloudrf.com/archive/YnJETGFWbjZsNDBlNVRQY1phUFFsdz09/tiff
                  tiff_3857:
                    type: string
                    format: uri
                    description: URL to GeoTIFF image file in Mercator projection
                    example: https://api.cloudrf.com/archive/YnJETGFWbjZsNDBlNVRQY1phUFFsdz09/tiff-3857
                  tiff_4326:
                    type: string
                    format: uri
                    description: URL to GeoTIFF image file in WGS84 projection
                    example: https://api.cloudrf.com/archive/YnJETGFWbjZsNDBlNVRQY1phUFFsdz09/tiff
                  kmz:
                    type: string
                    format: uri
                    description: URL to a KMZ file.
                    example: https://api.cloudrf.com/archive/YnJETGFWbjZsNDBlNVRQY1phUFFsdz09/kmz
                  shp:
                    type: string
                    format: uri
                    description: URL to a ESRI Shapefile.
                    example: https://api.cloudrf.com/archive/YnJETGFWbjZsNDBlNVRQY1phUFFsdz09/shp
                  json:
                    type: string
                    format: uri
                    description: URL to GeoJSON.
                    example: https://api.cloudrf.com/archive/YnJETGFWbjZsNDBlNVRQY1phUFFsdz09/json
                  zip:
                    type: string
                    format: uri
                    description: URL to a ATAK Mission Package.
                    example: https://api.cloudrf.com/archive/YnJETGFWbjZsNDBlNVRQY1phUFFsdz09/zip
                  url:
                    type: string
                    format: uri
                    description: URL to view layer on a map in a browser.
                    example: https://api.cloudrf.com/archive/calc?id=YnJETGFWbjZsNDBlNVRQY1phUFFsdz09
                  PNG_Mercator:
                    type: string
                    format: uri
                    description: URL to PNG image file applying the Mercartor projection standard.
                    example: https://api.cloudrf.com/output/projection/3857/40843/0722102238_Testing_A1
                  PNG_WGS84:
                    type: string
                    format: uri
                    description: URL to PNG image file applying the WGS84 standard.
                    example: https://api.cloudrf.com/users/40843/0722102238_Testing_A1.4326.png
                  bounds:
                    type: array
                    description: A list of image bounds as WGS84 decimal degrees. Order is clockwise from North,East,South,West.
                    items:
                      type: integer
                      format: float
                      example:
                      - 38.97373
                      - 1.505727
                      - 38.85827
                      - 1.390273
                  id:
                    type: string
                    description: Unique system identifier for the calculation. This is a one-up number from the main log table.
                    example: '3930916'
                  sid:
                    type: string
                    description: Private unique system identifier for the calculation. This is a hash of the one-up number from the main log table intended for public maps etc.
                    example: M2ZSaUZuVlVDRno3TTJDTGVqRGJlUT09
                  area:
                    type: number
                    format: float
                    description: Coverage area measured in kilometers squared (km2).
                    example: 0
                  coverage:
                    type: string
                    description: Site efficiency computed from requested radius versus actual coverage area. A perfect circle out at sea would be 100% efficient.
                    example: 0%
                  key:
                    type: array
                    description: Array of objects describing the RGB color schema as signal level in dB/dBm/dBuV, red, green and blue where red would be rgb(255,0,0).
                    items:
                      type: object
                      properties:
                        l:
                          type: string
                          description: Received signal power in dBm
                          example: -20dBm
                        r:
                          description: RED colour intensity. 0 to 255.
                          type: integer
                          example: 255
                        g:
                          description: GREEN colour intensity. 0 to 255.
                          type: integer
                          example: 19
                        b:
                          description: BLUE colour intensity. 0 to 255.
                          type: integer
                          example: 0
                      example:
                      - l: -20dBm
                        r: 255
                        g: 19
                        b: 0
                      - l: -24dBm
                        r: 255
