openapi: 3.2.0
info:
  title: CloudRF Account API
  description: The CloudRF API enables users to model and test radio propagation for any radio, anywhere. Authenticate by passing your API key in the request header as `key`. Set up a CloudRF.com account to generate this key. All data is transferred as JSON. For detailed documentation, visit docs.cloudrf.com.
  termsOfService: https://cloudrf.com/terms-and-conditions/
  contact:
    email: support@cloudrf.com
  version: '3.36'
servers:
- url: https://api.cloudrf.com
  description: Production environment
- url: https://dev.cloudrf.com
  description: Development environment
security:
- ApiKeyAuth: []
tags:
- name: Account
  description: This set of endpoints allow the user to manage their account.
paths:
  /my-metrics:
    get:
      operationId: myMetrics
      tags:
      - Account
      summary: Get metrics for API usage
      description: 'Get a detailed breakdown of metrics and statistics for your account API usage over your purchase period.

        This includes a breakdown of total API requests and their types, along with the different types of requests which were made on each day.'
      responses:
        '200':
          description: Success - JSON object returned containing metrics and statistics.
          content:
            application/json:
              schema:
                type: object
                description: An object containing the results of the /bsa call.
                properties:
                  from:
                    type: string
                    format: date-time
                    description: The period over which the metrics have been calculated.
                    example: '2022-07-10 13:06:36.851'
                  count_total:
                    type: number
                    format: integer
                    description: The total number of requests over the period.
                    example: 2279
                  time_series:
                    type: object
                    description: Array of objects describing the total calculation of each type for each day in ISO8601 format.
                    properties:
                      YYYY-MM-DD:
                        type: object
                        properties:
                          area:
                            type: number
                            format: integer
                            description: The number of area calculations on the day.
                          path:
                            type: number
                            format: integer
                            description: The number of path calculations on the day.
                          points:
                            type: number
                            format: integer
                            description: The number of points calculations on the day.
                          mesh:
                            type: number
                            format: integer
                            description: The number of mesh calculations on the day.
                          interference:
                            type: number
                            format: integer
                            description: The number of interference calculations on the day.
                          network:
                            type: number
                            format: integer
                            description: The number of network calculations on the day.
                          best_site_analysis:
                            type: number
                            format: integer
                            description: The number of best site analysis calculations on the day.
                    example:
                    - '2022-07-11':
                      - area: 1
                        path: 0
                        points: 0
                        mesh: 0
                        interference: 0
                        network: 0
                        best_site_analysis: 0
                    - '2022-07-12':
