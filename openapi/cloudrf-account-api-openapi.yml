                  types_total:
                    type: object
                    description: Object containing a total count of each of the different types of calculations over the period.
                    properties:
                      area:
                        type: number
                        format: integer
                        description: Count total of the number of area calculations over the period.
                        example: 1052
                      path:
                        type: number
                        format: integer
                        description: Count total of the number of path calculations over the period.
                        example: 250
